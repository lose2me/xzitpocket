name: Android Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Prepare Android signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_STORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/release.keystore"
          cat > "$GITHUB_WORKSPACE/android/key.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/android/release.keystore
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Signing mode
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/android/key.properties" ]]; then
            echo "Using release signing from GitHub Secrets."
          else
            echo "Signing secrets not found. Falling back to debug signing for release build."
          fi

      - name: Build release APKs
        run: >
          flutter build apk
          --release
          --split-per-abi
          --obfuscate
          --split-debug-info=build/symbols
          --dart-define=BUILD_CHANNEL=dev

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: xzitpocket-android-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/symbols/**
