name: Android Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build release APKs
        run: >
          flutter build apk
          --release
          --split-per-abi
          --obfuscate
          --split-debug-info=build/symbols

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: xzitpocket-android-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/symbols/**
